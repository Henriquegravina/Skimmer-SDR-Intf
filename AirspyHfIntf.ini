[Airspy]
; AGC de HF do radio (1 = ligado). Com AGC ligado, HfAtt e ignorado.
HfAgc=1
; Limiar do AGC: 0 = baixo, 1 = alto
HfAgcThreshold=0
; Atenuador manual, 0..8 (passos de 6 dB), usado so com HfAgc=0
HfAtt=0
; Pre-amplificador (LNA): 0 ou 1
HfLna=0
; Ganho digital extra em dB aplicado as amostras entregues ao Skimmer
GainDb=0
; 1 = inverte o sinal de Q (use se o espectro aparecer espelhado)
InvertQ=0
; Somado a frequencia pedida pelo Skimmer (transverter/upconverter), em Hz
FreqOffsetHz=0
; Numero de serie em hexadecimal para escolher um radio especifico (vazio = primeiro).
; O AirspyHfIntfConfig.exe lista os radios conectados.
Serial=
; 1 = abre a janela de configuracao quando o Skimmer inicia o radio
ShowWindow=1
; 1 = grava AirspyHfIntf.log nesta pasta
Log=0
