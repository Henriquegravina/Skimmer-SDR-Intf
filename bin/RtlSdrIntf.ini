[RtlSdr]
; Which dongle to use. -1 = first one found. The settings window fills these two in.
DeviceIndex=-1
Serial=
; HF reception: 0 = automatic (V3: direct sampling below 24 MHz, V4: built-in upconverter),
; 1 = force direct sampling on the I branch, 2 = force direct sampling on the Q branch
HfMode=0
; Sampling rate of the dongle in Hz: 1152000, 1536000, 1920000, 2304000 or 3072000.
; It is decimated down to the Skimmer's rate; a higher rate adds resolution to the
; 8-bit converter (about half a bit each time it doubles). 3072000 may drop samples on USB.
SampleRate=1536000
; Tuner AGC (1 = on). With it off, TunerGain is used.
TunerAgc=1
; Tuner gain in tenths of a dB (0 to 496); the nearest supported value is used
TunerGain=297
; Width of the tuner's analogue filter in Hz: 0 = automatic (as wide as the sampling rate), or 350000 to 1550000.
; A narrow one (350000) protects the converter from strong signals outside the Skimmer's band.
; It has no effect in direct sampling.
TunerBandwidthHz=0
; RTL2832 digital AGC: 0 or 1. It is the only gain control in direct sampling.
RtlAgc=0
; Bias-T: 1 puts DC power on the antenna connector. Leave at 0 unless the antenna or LNA needs it.
BiasTee=0
; Frequency correction in ppm
Ppm=0
; Extra digital gain in dB applied to the samples delivered to the Skimmer
GainDb=0
; 1 = invert the sign of Q (use if the spectrum is mirrored)
InvertQ=0
; Added to the frequency requested by the Skimmer (external upconverter/transverter), in Hz
FreqOffsetHz=0
; 1 = open the settings window when the Skimmer starts the radio
ShowWindow=1
; 1 = write RtlSdrIntf.log to this folder
Log=0
